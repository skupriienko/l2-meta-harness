[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l2-meta-harness"
version = "1.1.0"
description = "Level-2 Recursive Meta-Harness & Drift Evaluator for AI Agent Rules and Skills (Harness²)"
readme = "README.md"
authors = [
  { name = "Serhii Kupriienko", email = "61395455+skupriienko@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
  "ai-agents",
  "developer-tools",
  "kilo-code",
  "claude-code",
  "cursor",
  "ast",
  "automation"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
  "pre-commit>=3.0.0"
]

[project.scripts]
meta-harness = "l2_meta_harness.cli:main"

[project.urls]
Homepage = "https://github.com/skupriienko/l2-meta-harness"
Repository = "https://github.com/skupriienko/l2-meta-harness.git"
Issues = "https://github.com/skupriienko/l2-meta-harness/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.json", "*.md"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
